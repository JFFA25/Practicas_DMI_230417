<!DOCTYPE html>

<title>flutter_application_1 — Arquitectura interactiva · Práctica 02</title>
<style>
:root{

  --bg:#f4f6fc; --panel:#ffffff; --panel2:#f7f9ff;

  --shadow:0 8px 24px rgba(30,50,110,.14);

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
svg{display:block;font-family:inherit}
#topbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:30;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#brand{display:flex;align-items:center;gap:10px;min-width:0}
#brand .mark{width:30px;height:30px;border-radius:8px;flex:0 0 auto;
  background:linear-gradient(140deg,#7c9cff,#c084fc 55%,#f472b6);display:grid;place-items:center;
  color:#0b1020;font-weight:800;font-size:12.5px}
#brand h1{margin:0;font-size:14px;font-weight:700;white-space:nowrap}
#brand p{margin:1px 0 0;font-size:10.5px;color:var(--txt3);white-space:nowrap}
#views{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--txt2);padding:6px 11px;
  border-radius:8px;font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{color:var(--txt);border-color:var(--accent);transform:translateY(-1px)}
.btn.active{background:var(--panel2);border-color:var(--accent);color:var(--txt);box-shadow:inset 0 0 0 1px var(--accent)}
.spacer{flex:1}
#tools{display:flex;align-items:center;gap:6px}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;padding:0;border:1px solid var(--line2);
  background:var(--panel2);color:var(--txt2);border-radius:8px;cursor:pointer;transition:.15s;font-size:16px;line-height:1}
.iconbtn:hover{color:var(--txt);border-color:var(--accent)}
.iconbtn.on{border-color:var(--accent);color:var(--txt)}
#zoomval{font-size:11px;color:var(--txt3);width:42px;text-align:center;font-variant-numeric:tabular-nums}
#stage{position:fixed;inset:56px 0 0 0}
#diag{width:100%;height:100%;cursor:grab;touch-action:none}
#diag.panning{cursor:grabbing}
text{user-select:none;-webkit-user-select:none}
#details{position:fixed;right:14px;top:70px;width:330px;max-height:calc(100vh - 100px);z-index:40;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;transition:opacity .18s,transform .18s}
#details.hidden{opacity:0;transform:translateX(14px);pointer-events:none}
#dhead{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:flex-start}
#dclose{margin-left:auto;background:none;border:none;color:var(--txt3);cursor:pointer;font-size:17px;line-height:1;padding:0 2px}
#dclose:hover{color:var(--txt)}
#dbody{padding:12px 14px 14px;overflow:auto;font-size:12.5px;line-height:1.55}
#dbody .path{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:10.5px;color:var(--txt3);
  word-break:break-all;margin-top:4px}
#dbody .sub{color:var(--txt2);margin-top:6px}
#dbody .tip{color:var(--txt2);margin-top:9px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;font-size:11.8px;line-height:1.6}
#dbody h5{margin:14px 0 6px;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--txt3);
  display:flex;align-items:center;gap:6px}
#dbody h5 .dot{width:7px;height:7px;border-radius:50%}
.rel{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt2);border-radius:8px;padding:6px 8px;margin-bottom:5px;cursor:pointer;font-size:11.5px;transition:.13s}
.rel:hover{border-color:var(--accent);color:var(--txt);transform:translateX(2px)}
.rel .dir{display:inline-block;font-weight:800;margin-right:6px;font-size:10px}
.rel.out .dir{color:#f472b6}.rel.in .dir{color:#34d399}
.rel em{font-style:normal;color:var(--txt3);display:block;margin-top:2px;font-size:10.5px}
#hint{color:var(--txt3);font-size:12.5px;line-height:1.65}
#hint b{color:var(--txt2)}
kbd{background:var(--panel2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;
  padding:1px 5px;font-size:10.5px;font-family:ui-monospace,Consolas,monospace;color:var(--txt2)}
#legend{position:fixed;left:14px;bottom:14px;z-index:40;width:238px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:10px 11px;box-shadow:var(--shadow)}
#legend h4{margin:0 0 7px;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--txt3)}
#legend .row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--txt2);padding:2.5px 0}
#legend .sw{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
#legend .tg{font-size:8.5px;font-weight:800;letter-spacing:.5px;color:var(--txt3);
  background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 3px;flex:0 0 auto}
#legend .cnt{margin-left:auto;font-size:10px;color:var(--txt3);font-variant-numeric:tabular-nums}
#stats{position:fixed;right:14px;bottom:14px;z-index:40;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:8px 12px;box-shadow:var(--shadow);font-size:11px;color:var(--txt3);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:330px}
#stats b{color:var(--txt);font-variant-numeric:tabular-nums}
#toggles{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;display:flex;gap:6px}
</style>
</head>

  <div id="dbody"></div>

<div id="toggles">

  <button class="btn" id="btnCollapseAll">Colapsar todo</button>

/* ===========================================================================

   =========================================================================== */
const VIEWS = [
  {id:"full",   label:"Vista completa",             layers:"all",      mode:"default"},
  {id:"deps",   label:"Dependencias y recursos",    layers:["deps","pkgs"], mode:"expandAll"},
  {id:"code",   label:"Código fuente y pruebas",    layers:["deps","lib","pres"], mode:"expandAll"},
  {id:"screens",label:"presentation/counter/",      layers:["lib","pres"], mode:"default"},

<script>

const COLGAP = 136, LAYERHEAD = 62, MARGIN = 40;

const NODES = {}, GROUPS = {}, GROUP_OF = {};
LAYERS.forEach(L => L.groups.forEach(g => {

  "g-manifest":ROOT, "g-quality":ROOT, "g-docs":ROOT, "g-test":ROOT+"test/",
  "g-fonts":ROOT, "g-images":ROOT, "g-boot":ROOT,
  "g-funcs":ROOT+"lib/presentation/counter/", "g-simple":ROOT+"lib/presentation/counter/",
  "g-pkgrt":ROOT+"pubspec.yaml", "g-pkgdev":ROOT+"pubspec.yaml",
  "g-buildroot":ROOT, "g-darttool":ROOT, "g-uta":ROOT+"build/unit_test_assets/",
  "g-tcache":ROOT, "g-nassets":ROOT,
  "g-android":ROOT, "g-ios":ROOT, "g-macos":ROOT, "g-linux":ROOT,
  "g-windows":ROOT, "g-web":ROOT
};
/* Rutas explícitas para etiquetas abreviadas con "…" o agrupadas */
const PATHOVER = {
  "ad-manifests"  : ROOT+"android/app/src/debug/AndroidManifest.xml  ·  android/app/src/profile/AndroidManifest.xml",
  "ad-activity"   : ROOT+"android/app/src/main/kotlin/com/example/flutter_application_1/MainActivity.kt",
  "ad-registrant" : ROOT+"android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java",
  "ios-pbxws"     : ROOT+"ios/Runner.xcodeproj/project.xcworkspace/contents.xcworkspacedata",
  "ios-scheme"    : ROOT+"ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme",
  "ad-draw"       : ROOT+"android/app/src/main/res/drawable/launch_background.xml  ·  drawable-v21/launch_background.xml",
  "ad-values"     : ROOT+"android/app/src/main/res/values/styles.xml  ·  values-night/styles.xml",
  "ad-mipmaps"    : ROOT+"android/app/src/main/res/mipmap-{hdpi,mdpi,xhdpi,xxhdpi,xxxhdpi}/ic_launcher.png"

function pathOf(id, label){
  if(PATHOVER[id]) return PATHOVER[id];

  if(lbl.indexOf("/") >= 0) return ROOT + lbl;
  const g = GROUPS[GROUP_OF[id]];
  const pre = GPREFIX[g ? g.id : ""] || ROOT;
  /* pkgs: la "ruta" es la entrada de pubspec.yaml que la declara */
  if(/\.[a-z0-9]+$/.test(pre) && /\s/.test(lbl)) return pre + "  ·  " + lbl;

/* Segunda pasada: los nodos ya pueden resolver su ruta */
LAYERS.forEach(L => L.groups.forEach(g => {
  g.nodes.forEach(n => { NODES[n[0]] = {id:n[0], label:n[1], kind:n[2], sub:n[3], tip:n[4],
                                       group:g.id, layer:L.id, path:pathOf(n[0], n[1])}; });
}));

const collapsed = {};

defaultCollapsed();

let visLayers = "all", selected = null, showLabels = true;

const PLAT_LABEL = {"g-android":"android/","g-ios":"ios/","g-macos":"macos/","g-linux":"linux/","g-windows":"windows/","g-web":"web/"};

/* ---------------- LAYOUT ---------------- */
function layout(){
  const cols = LAYERS.filter(L => visLayers === "all" || visLayers.indexOf(L.id) >= 0);
  const boxes = {};
  let maxH = 0;
  cols.forEach((L,ci) => {
    const x = MARGIN + ci * (NW + COLGAP);
    let y = MARGIN + LAYERHEAD;
    L.groups.forEach(g => {
      if(visLayers !== "all" && visLayers.indexOf(g.layer) < 0) return;
      if(collapsed[g.id]){
        boxes["group:"+g.id] = {x, y, w:NW, h:NH, kind:g.k, g:g.id, sum:true};
        y += NH + GGAP;
      }else{
        const h = GHDR + GPAD*2 + g.nodes.length*NH + (g.nodes.length-1)*NGAP;
        boxes["group:"+g.id] = {x, y, w:NW, h, kind:g.k, g:g.id, sum:false};
        g.nodes.forEach((n,i) => {

  cols.forEach(L => { const off = (maxH - L._h)/2;
    L.groups.forEach(g => {
      const b = boxes["group:"+g.id];
      if(!b) return;
      b.y += off;
      if(!b.sum) g.nodes.forEach(n => boxes[n[0]].y += off);
    });
  });
  const W = MARGIN*2 + cols.length*(NW+COLGAP) - COLGAP;
  const H = MARGIN*2 + LAYERHEAD + maxH;

}

/* ---------------- GEOMETRÍA DE EXTREMOS ---------------- */
function endpoint(ref, boxes){
  if(ref.indexOf("group:") === 0){
    const b = boxes[ref];
    if(!b) return null;
    if(b.sum) return {x:b.x+b.w, y:b.y+b.h/2, box:b};
    return {x:b.x+b.w, y:b.y+GHDR/2, box:b};
  }
  const b = boxes[ref];
  if(!b) return null;
  return {x:b.x+b.w, y:b.y+b.h/2, box:b};
}
function resolveVisible(ref, boxes){
  if(ref.indexOf("group:") === 0) return boxes[ref] ? ref : null;

  /* El nodo no tiene caja porque su grupo está colapsado: se dibuja contra el grupo */
  const gid = GROUP_OF[ref];

/* ---------------- RENDER ---------------- */
const svg = document.getElementById("diag");

const EL = (n,a) => { const e = document.createElementNS("http://www.w3.org/2000/svg", n);

    t.textContent = L.t; gBands.appendChild(t);

    s.textContent = L.s; gBands.appendChild(s);

    rg.appendChild(EL("rect", {x:b.x, y:b.y, w:b.w, h:3.5, rx:2, fill:col, "fill-opacity":".9"}));
    rg.appendChild(iconEl(b.kind, b.x+10, b.y+8, 14, col));
    const ht = EL("text", {x:b.x+30, y:b.y+19, "font-size":"10.5", "font-weight":"700", fill:col, "letter-spacing":".4"});
    ht.textContent = trunc(g.t.toUpperCase(), 30); rg.appendChild(ht);
    rg.appendChild(EL("path", {d: b.sum ? "M2 0l4 4-4 4" : "M0 2l4 4 4-4",

      "stroke-width":1.6, "stroke-linecap":"round", "stroke-linejoin":"round"}));

    rg.appendChild(hdr);

    const b = boxes[id]; if(!b) return;

    g.appendChild(EL("rect", {x:b.x, y:b.y+6, width:3, height:b.h-12, rx:2, fill:col}));
    g.appendChild(iconEl(n.kind, b.x+11, b.y+10, 15, col));
    const tg = EL("text", {x:b.x+b.w-9, y:b.y+14, "font-size":"8", "font-weight":"800",
      "text-anchor":"end", fill:col, "fill-opacity":".85", "letter-spacing":".4"});
    tg.textContent = k.t; g.appendChild(tg);
    const t1 = EL("text", {x:b.x+32, y:b.y+15, "font-size":"11.5", "font-weight":"600", fill:"var(--txt)"});
    t1.textContent = trunc(n.label, 25); g.appendChild(t1);
    const t2 = EL("text", {x:b.x+32, y:b.y+28, "font-size":"9.5", fill:"var(--txt3)"});
    t2.textContent = trunc(n.sub, 30); g.appendChild(t2);

}

function isNeighbour(id){
  if(!selected) return true;
  if(selected === id) return true;

  const grp = GROUP_OF[id];

  return EDGES.some(e => (e[0] === selected && e[1] === id) || (e[1] === selected && e[0] === id));
}

function drawEdges(boxes){

    const a = resolveVisible(e[0], boxes), b = resolveVisible(e[1], boxes);
    if(!a || !b || a === b) return;

    if(!pa || !pb) return;
    items.push({a, b, pa, pb, lbl:e[2]});
  });

  items.forEach(it => { (byT[it.b] = byT[it.b] || []).push(it); });
  Object.keys(byT).forEach(t => {
    const arr = byT[t].sort((x,y) => x.pa.y - y.pa.y);
    let last = -1e9;
    arr.forEach(it => { let y = (it.pa.y + it.pb.y)/2; if(y < last + 11) y = last + 11; it.ly = y; last = y; });
  });

  items.forEach(it => {
    const on = selected && (it.a === selected || it.b === selected);
    const col = on ? "var(--accent)" : "var(--edge)";
    let d, lx;
    const sameCol = it.pa.x === it.pb.x;
    if(sameCol){
      const bulge = it.pa.x + 58;
      d = "M"+it.pa.x+","+it.pa.y+" C"+bulge+","+it.pa.y+" "+bulge+","+it.pb.y+" "+it.pb.x+","+it.pb.y;
      lx = bulge + 6;
    }else{
      const mx = (it.pa.x + it.pb.x)/2;
      d = "M"+it.pa.x+","+it.pa.y+" C"+mx+","+it.pa.y+" "+mx+","+it.pb.y+" "+it.pb.x+","+it.pb.y;
      lx = mx;
    }
    const p = EL("path", {d, fill:"none", stroke:col, "stroke-width":on ? 2.1 : 1.1,
      "stroke-opacity": selected ? (on ? 1 : .13) : .62, "marker-end":"url(#arw)",
      "stroke-dasharray": it.lbl.indexOf("Flutter build") === 0 ? "5 3" : null});
    p.style.cursor = "pointer";
    p.addEventListener("mouseenter", () => { p.setAttribute("stroke-opacity", 1); p.setAttribute("stroke-width", 2.4); });
    p.addEventListener("mouseleave", () => { p.setAttribute("stroke-opacity", selected ? (on?1:.13) : .62);
                                              p.setAttribute("stroke-width", on ? 2.1 : 1.1); });
    p.addEventListener("click", ev => { ev.stopPropagation(); select(it.a); });
    gEdges.appendChild(p);

    if(showLabels){
      const w = it.lbl.length*4.55 + 9;
      const g = EL("g", {opacity: selected ? (on ? 1 : .1) : .82, "pointer-events":"none"});
      g.appendChild(EL("rect", {x:lx-w/2, y:(it.ly||0)-7.5, w, h:12, rx:4, fill:"var(--bg)", "fill-opacity":".92"}));
      const t = EL("text", {x:lx, y:(it.ly||0)+1.8, "font-size":"8.4", "text-anchor":"middle",
                            fill: on ? "var(--accent)" : "var(--edgeLbl)"});
      t.textContent = it.lbl; g.appendChild(t);
      gLabels.appendChild(g);
    }

}

/* ---------------- SELECCIÓN / DETALLE ---------------- */
function relsOf(id){
  const out = [], inn = [];
  EDGES.forEach(e => {
    if(e[0] === id) out.push([e[1], e[2]]);
    if(e[1] === id) inn.push([e[0], e[2]]);
  });
  return {out, inn};
}
function relLabel(r){
  if(r.indexOf("group:") === 0){
    const g = GROUPS[r.slice(6)];
    return g ? g.t : r;
  }

}

  if(!selected){ d.classList.add("hidden"); render(); return; }
  d.classList.remove("hidden");
  if(selected.indexOf("group:") === 0){
    const gid = selected.slice(6), g = GROUPS[gid];
    const r = relsOf(selected);
    const counts = {};
    g.nodes.forEach(n => { const k = n[2]; counts[k] = (counts[k]||0)+1; });
    document.getElementById("dicon").innerHTML = iconSvg(g.k, 20, KINDS[g.k].c);
    document.getElementById("dtitle").textContent = g.t;
    document.getElementById("dpath").textContent = (PLAT_LABEL[gid] || folderOf(gid) || "flutter_application_1/") +
      "  ·  " + g.nodes.length + (g.nodes.length === 1 ? " elemento" : " elementos");
    let h = '<div class="sub">' + Object.keys(counts).map(k =>
        '<span style="color:'+KINDS[k].c+'">■</span> ' + counts[k] + " " + KINDS[k].l.toLowerCase()).join(" · ") + '</div>';
    h += '<h5>Elementos del grupo</h5>';
    g.nodes.forEach(n => { h += '<button class="rel" data-go="'+n[0]+'"><span class="dir">→</span>' + esc(n[1]) +
      '<em>' + esc(n[3]) + '</em></button>'; });
    h += relHTML(r, id);
    fillBody(h); render();
  }else{
    const n = NODES[id], k = KINDS[n.kind], r = relsOf(id);
    document.getElementById("dicon").innerHTML = iconSvg(n.kind, 20, k.c);
    document.getElementById("dtitle").textContent = n.label;
    document.getElementById("dpath").textContent = n.path;
    fillBody('<div class="sub" style="color:'+k.c+';font-weight:600"><b>'+k.t+'</b> · '+ k.l +
      (n.sub ? ' — ' + esc(n.sub) : '') + '</div>' +
      (n.tip ? '<div class="tip">' + esc(n.tip) + '</div>' : '') + relHTML(r, id));
    render();
  }
}
function folderOf(gid){
  const m = {"g-manifest":"flutter_application_1/","g-quality":"flutter_application_1/","g-docs":"flutter_application_1/",
    "g-test":"flutter_application_1/test/","g-fonts":"flutter_application_1/assets/fonts/",
    "g-images":"flutter_application_1/images/","g-boot":"flutter_application_1/lib/",
    "g-funcs":"flutter_application_1/lib/presentation/counter/","g-simple":"flutter_application_1/lib/presentation/counter/",
    "g-pkgrt":"flutter_application_1/pubspec.yaml","g-pkgdev":"flutter_application_1/pubspec.yaml",
    "g-buildroot":"flutter_application_1/","g-darttool":"flutter_application_1/.dart_tool/",
    "g-uta":"flutter_application_1/build/unit_test_assets/","g-tcache":"flutter_application_1/build/test_cache/",
    "g-nassets":"flutter_application_1/build/native_assets/"};
  return m[gid] === undefined ? "" : m[gid];
}
function relHTML(r, id){
  let h = "";
  const blk = (title, arr, cls, dot) => {
    if(!arr.length) return "";
    h += '<h5><span class="dot" style="background:'+dot+'"></span>' + title + ' (' + arr.length + ')</h5>';
    arr.forEach(x => { h += '<button class="rel '+cls+'" data-go="'+x[0]+'">' +
      '<span class="dir">' + (cls === "out" ? "→" : "←") + '</span>' + esc(relLabel(x[0])) +
      '<em>' + esc(x[1]) + '</em></button>'; });

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function iconSvg(kind, size, col){
  const k = KINDS[kind] || KINDS.config;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 16 16" fill="none" stroke="'+col+
    '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +

}
function fillBody(h){
  const b = document.getElementById("dbody");
  b.innerHTML = h;
  b.querySelectorAll("[data-go]").forEach(btn => btn.addEventListener("click", () => {
    const t = btn.getAttribute("data-go");

}

/* ---------------- ZOOM / PAN ---------------- */
let k = 1, tx = 0, ty = 0;
const vp = document.getElementById("viewport");
function applyT(){
  vp.setAttribute("transform","translate("+tx+","+ty+") scale("+k+")");
  document.getElementById("zoomval").textContent = Math.round(k*100) + "%";
}
function zoomAt(cx, cy, f){
  const nk = Math.min(2.6, Math.max(.1, k*f));
  tx = cx - (cx - tx) * (nk/k); ty = cy - (cy - ty) * (nk/k); k = nk; applyT();
}
function fit(){
  if(!LAY) return;
  const r = svg.getBoundingClientRect();
  const s = Math.min((r.width-40)/LAY.W, (r.height-40)/LAY.H);
  k = Math.min(1.25, Math.max(.1, s));
  tx = (r.width - LAY.W*k)/2; ty = (r.height - LAY.H*k)/2;
  applyT();
}
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, ev.deltaY < 0 ? 1.12 : 1/1.12);
}, {passive:false});
let down = null;
svg.addEventListener("pointerdown", ev => { down = {x:ev.clientX, y:ev.clientY, tx, ty};
  svg.classList.add("panning"); svg.setPointerCapture(ev.pointerId); });
svg.addEventListener("pointermove", ev => { if(!down) return;
  tx = down.tx + (ev.clientX-down.x); ty = down.ty + (ev.clientY-down.y); applyT(); });
svg.addEventListener("pointerup", () => { down = null; svg.classList.remove("panning"); });
svg.addEventListener("click", ev => { if(ev.target === svg || ev.target.id === "viewport"){
  selected = null; document.getElementById("details").classList.add("hidden"); render(); } });
document.getElementById("btnIn").addEventListener("click", () => { const r = svg.getBoundingClientRect();
  zoomAt(r.width/2, r.height/2, 1.2); });
document.getElementById("btnOut").addEventListener("click", () => { const r = svg.getBoundingClientRect();
  zoomAt(r.width/2, r.height/2, 1/1.2); });
document.getElementById("btnFit").addEventListener("click", fit);
document.getElementById("btnLabels").addEventListener("click", e => {
  showLabels = !showLabels; e.currentTarget.classList.toggle("on", showLabels); render(); });
document.getElementById("btnTheme").addEventListener("click", () => {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === "dark" ? "light" : "dark"; });
document.getElementById("dclose").addEventListener("click", () => {
  selected = null; document.getElementById("details").classList.add("hidden"); render(); });
document.addEventListener("keydown", ev => {
  if(ev.key === "Escape"){ selected = null; document.getElementById("details").classList.add("hidden"); render(); }
  if(ev.key === "f" || ev.key === "F") fit();
});
document.getElementById("btnExpandAll").addEventListener("click", () => {
  Object.keys(collapsed).forEach(id => collapsed[id] = false); render(); fit(); });
document.getElementById("btnCollapseAll").addEventListener("click", () => {
  Object.keys(collapsed).forEach(id => collapsed[id] = true); render(); fit(); });
document.getElementById("btnReset").addEventListener("click", () => {
  defaultCollapsed(); visLayers = "all"; applyView("full"); });

/* ---------------- VISTAS ---------------- */
const viewsBox = document.getElementById("views");
VIEWS.forEach(v => {
  const b = document.createElement("button");
  b.className = "btn" + (v.id === "full" ? " active" : "");
  b.textContent = v.label; b.dataset.v = v.id;
  b.addEventListener("click", () => applyView(v.id));
  viewsBox.appendChild(b);
});
function applyView(id, skipFit){
  const v = VIEWS.find(x => x.id === id); if(!v) return;
  visLayers = v.layers;
  if(v.mode === "default") defaultCollapsed();
  if(v.mode === "expandAll") Object.keys(collapsed).forEach(g => collapsed[g] = false);
  if(v.mode === "collapseAll") Object.keys(collapsed).forEach(g => collapsed[g] = true);
  if(v.expand) v.expand.forEach(g => collapsed[g.slice(6)] = false);
  viewsBox.querySelectorAll(".btn").forEach(b => b.classList.toggle("active", b.dataset.v === id));
  selected = null; document.getElementById("details").classList.add("hidden");
  render(); if(!skipFit) fit();
}

/* ---------------- LEYENDA / STATS ---------------- */
function legendHtml(){
  const counts = {};
  Object.keys(NODES).forEach(id => { const kk = NODES[id].kind; counts[kk] = (counts[kk]||0)+1; });
  return Object.keys(KINDS).filter(kk => counts[kk]).map(kk =>
    '<div class="row"><span class="sw" style="background:'+KINDS[kk].c+'"></span>' +
    '<span class="tg">'+KINDS[kk].t+'</span>'+KINDS[kk].l +
    '<span class="cnt">'+counts[kk]+'</span></div>').join("");
}
function updateStats(){
  const nNodes = Object.keys(NODES).length, nGroups = Object.keys(GROUPS).length;
  const vis = new Set(); LAY.boxes && Object.keys(LAY.boxes).forEach(b => vis.add(b));
  document.getElementById("stats").innerHTML =
    "<span><b>" + nNodes + "</b> nodos</span><span><b>" + nGroups + "</b> grupos</span>" +
    "<span><b>" + LAY.cols.length + "</b> capas</span><span><b>" + EDGES.length + "</b> conexiones</span>" +
    "<span><b>" + vis.size + "</b> en pantalla</span>";
}

/* ---------------- ARRANQUE ---------------- */
document.getElementById("dbody").innerHTML =
  '<div id="hint"><b>Clic</b> en un nodo para ver sus conexiones directas · <b>Clic</b> en la cabecera de un grupo para colapsarlo · ' +
  '<b>Clic</b> en un chip resumen para expandirlo.<br><br>' +
  '<b>Rueda</b> para zoom · <b>arrastrar</b> para mover · <b>F</b> o <kbd>⤢</kbd> para ajustar a pantalla · <kbd>Esc</kbd> para limpiar la selección.<br><br>' +
  'Cada nodo lleva arriba a la derecha su <b>tipo</b> (SRC, CFG, AST, BLD, TGT…). Usa las <b>vistas guiadas</b> de arriba para saltar a Dependencias, Código fuente, presentation/counter/ o Targets sin expandir a mano.</div>';
applyView("full", true);
fit();
window.addEventListener("resize", () => fit());
</script>
