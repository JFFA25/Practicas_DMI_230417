name: cinemapedia
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  animate_do: ^4.2.0
  card_swiper: ^3.0.1
  dio: ^5.8.0
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^17.3.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  youtube_player_flutter: ^10.0.1

  # `isar` (3.x) is abandoned and does not build with Android Gradle Plugin 8+.
  # `isar_community` is the maintained drop-in fork. Both packages must share the
  # exact same version.
  isar_community: 3.4.1
  isar_community_flutter_libs: 3.4.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/loaders/
