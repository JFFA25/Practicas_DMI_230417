name: cinemapedia
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  animate_do: ^5.1.0
  card_swiper: ^3.0.1
  dio: ^5.11.1
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.4.3
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^18.1.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  youtube_player_flutter: ^9.1.3

  # Mantienes el fork correcto e imprescindible para Gradle 8+
  isar_community: 3.4.1
  isar_community_flutter_libs: 3.4.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/loaders/
